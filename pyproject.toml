[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mada"
description = "Multi-agent orchestration system for MADA workflows"
version = "0.1.0"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "agent-framework>=1.0.1",
    "autogen-ext[mcp]>=0.7.4",
    "fastapi",
    "gradio>=6.2.0",
    "openai",
    "python-dotenv",
    "psycopg2",
    "tiktoken",
    "uvicorn",
    "click"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "Apache-2.0 WITH LLVM-exception"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/llnl/mada"
Documentation = "https://software.llnl.gov/mada
Issues = "https://github.com/llnl/mada/issues"
"Release Notes" = "https://github.com/llnl/mada/releases"

[project.optional-dependencies]
# Testing requirements
tests = [
    "pytest",
    "pytest-asyncio",
    "jeds-cli",
]

# Documentation requirements
docs = [
    "markdown-grid-tables",  # Support for grid tables in Markdown
    "mkdocs<2.0.0",  # Static site generator for project documentation
    "mkdocs-codeinclude-plugin",  # Include code snippets in MkDocs
    "mkdocs-material",  # Material theme for MkDocs
    "mkdocs-glightbox",  # Allows for image lightboxing in MkDocs

    # API docs requirements
    "mkdocs-literate-nav",  # Enhanced navigation for MkDocs (SUMMARY.md support)
    "mkdocs-gen-files",  # Generate files for MkDocs at build time
    "mkdocstrings",  # Automatic API documentation from docstrings
    "mkdocstrings-python",  # Python handler for mkdocstrings
]

# All requirements
all = ["mada[tests, docs]"]

[project.scripts]
mada = "mada.main:main"
mada-gradio = "mada.interfaces.gradio.main:main"
mada-cli = "mada.interfaces.cli.main:main"
mada-openai-api = "mada.interfaces.openai_api.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mada = ["interfaces/gradio/assets/*.css", "interfaces/gradio/assets/*.js"]
